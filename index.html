<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30-Day Web Dev Kaizen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <header>
    <h1>30-day Web Development Kaizen Practice</h1>
    <p>10–15 minutes a day. Click a topic to learn, tap the card to mark complete.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span><strong id="done-count">0</strong> of 30 days complete</span>
      <span id="pct-label">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>

  <div id="weeks"></div>

  <footer>
    <button class="reset-btn" onclick="resetAll()">reset progress</button>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
