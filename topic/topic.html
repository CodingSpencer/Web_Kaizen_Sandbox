<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen Practice Session</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="loading-overlay">
  <div class="spinner"></div>
</div>

<div class="container">

  <a href="../index.html" class="back-link">← Back to Dashboard</a>

  <main id="topic-area">
    <h1 id="topic-title">Loading Topic...</h1>
    
    <div class="task-box">
      <strong>🎯 Today's 10-15 Min Task:</strong>
      <p id="topic-task" style="margin: 0.5rem 0 0 0;"></p>
    </div>

    <h2>Core Concept</h2>
    <div id="topic-concept" class="concept-section"></div>

    <h2>Video Tutorial (3-5 mins)</h2>
    <div class="video-container">
      <iframe id="topic-video-frame" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <h2>Code Example / Reference</h2>
    <pre><code id="topic-code"></code></pre>
  </main>

</div>

<script src="topic-handler.js"></script>
</body>
</html>
