<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen Practice Session</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Unique styles for the study subpage layout */
    .back-link { display: inline-block; margin-bottom: 1.5rem; color: #0076ff; text-decoration: none; font-weight: bold; }
    .back-link:hover { text-decoration: underline; }
    .task-box { background: #f0f4f8; border-left: 4px solid #0076ff; padding: 1rem; margin: 1.5rem 0; border-radius: 0 4px 4px 0; }
    .concept-section { line-height: 1.6; color: #333; margin-bottom: 2rem; }
    pre { background: #1e1e1e; color: #dcdcdc; padding: 1.25rem; border-radius: 6px; overflow-x: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; }
    .error-msg { text-align: center; color: #e53e3e; margin-top: 4rem; }
  </style>
</head>
<body>
<div class="container">

  <a href="../index.html" class="back-link">← Back to Dashboard</a>

  <main id="content-area">
    <h1 id="topic-title">Loading Topic...</h1>
    
    <div class="task-box">
      <strong>🎯 Today's 10-15 Min Task:</strong>
      <p id="topic-task" style="margin: 0.5rem 0 0 0;"></p>
    </div>

    <h2>Core Concept</h2>
    <div id="topic-concept" class="concept-section"></div>

    <h2>Video Tutorial (3-5 mins)</h2>
    <div class="video-container">
      <iframe id="topic-video-frame" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <h2>Code Example / Reference</h2>
    <pre><code id="topic-code"></code></pre>
  </main>

</div>

<script src="topic-handler.js"></script>
</body>
</html>
